<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メール帯プレビュー検討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 左にメール帯プレビュー（受信箱風）、右に件名案／本文案の選択グリッド。狭い画面では縦積み */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#17262e; --muted:#5d6f78; --line:#cdd8de;
  --accent:#165c7d; --accent-fg:#ffffff; --accent-soft:#dcebf2;
  --icon:#e8792f; --field:#eaf0dc; --hot:#d21f1f; --flash:#fff3b0;
  --display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --surface:#17242b; --fg:#e4edf1; --muted:#93a7b1; --line:#2c3d46;
  --accent:#3f93ba; --accent-fg:#06141b; --accent-soft:#1d3a49;
  --icon:#f08a45; --field:#26321f; --hot:#ff6b6b; --flash:#4a4214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --surface:#17242b; --fg:#e4edf1; --muted:#93a7b1; --line:#2c3d46;
  --accent:#3f93ba; --accent-fg:#06141b; --accent-soft:#1d3a49;
  --icon:#f08a45; --field:#26321f; --hot:#ff6b6b; --flash:#4a4214; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}

/* ---------- ヘッダー ---------- */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.title-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;min-width:0}
h1{font-family:var(--display);font-size:22px;margin:0;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left;max-width:100%;display:flex;gap:6px;align-items:baseline}
.tab b{font-family:var(--display);color:var(--accent);flex:none}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab[aria-selected="true"] b{color:var(--accent-fg)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.params{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:12px;color:var(--muted)}
.params label{display:flex;align-items:center;gap:6px}
.params input{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);font-family:var(--mono);font-size:12px}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn-ghost:hover{border-color:var(--accent)}

.board{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-size:16px;margin:0 0 4px}
.panel .hint{margin:0 0 14px;font-size:12px;color:var(--muted)}
.panel .hint b{color:var(--fg)}

/* ---------- プレビュー ---------- */
.band-label{font-size:12px;font-weight:700;color:var(--icon);letter-spacing:.04em;margin-bottom:6px}
.bands{display:flex;flex-direction:column;gap:8px}
.band{display:grid;grid-template-columns:12px 36px 1fr;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface);transition:box-shadow .15s,border-color .15s}
.band:hover{border-color:var(--accent)}
.band:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.band .num{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.band.active .num{color:var(--accent)}
.band .icon{width:36px;height:36px;border-radius:50%;background:var(--icon);color:#fff;display:grid;place-items:center;font-size:8px;font-weight:700;position:relative;letter-spacing:-.02em}
.band .badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--accent);color:var(--accent-fg);font-size:9px;font-weight:700;padding:0 5px;border-radius:9px;opacity:0;transition:opacity .15s}
.band.active .badge{opacity:1}
.band .lines{display:flex;flex-direction:column;gap:3px;min-width:0}
/* 件名15字・本文16字が1行に収まる幅を確保（13px × 16字 ≒ 208px） */
.pv{background:var(--field);border:1px solid var(--line);border-radius:3px;padding:1px 3px 1px 6px;font-size:13px;min-height:24px;display:flex;align-items:center;gap:4px;min-width:0;transition:background .5s}
.pv .txt{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0;flex:1;line-height:20px;letter-spacing:0}
.pv .txt.empty{color:var(--muted)}
.pv .src{flex:none;font-family:var(--mono);font-size:9px;color:var(--muted)}
@media (max-width:480px){.pv{font-size:12px}.pv .src{display:none}}
.pv.flash{background:var(--flash)}
.pv.sender{cursor:text}
.pv.sender input{border:0;border-bottom:1px dashed transparent;background:transparent;color:var(--fg);font:inherit;width:100%;padding:2px 0;cursor:text}
.pv.sender:hover input{border-bottom-color:var(--muted)}
.pv.sender input:focus{outline:none;border-bottom-color:var(--accent)}
.pv.sender input::placeholder{color:var(--muted)}
.clear{flex:none;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:3px;font:inherit;font-size:12px;padding:0;cursor:pointer;line-height:1}
.clear:hover:not(:disabled){border-color:var(--hot);color:var(--hot)}
.clear:disabled{opacity:.35;cursor:default}
.clear:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- 選択画面 ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-head{background:var(--accent);color:var(--accent-fg);text-align:center;font-family:var(--display);font-size:15px;padding:8px;border-radius:4px}
.col-head small{display:block;font-family:var(--body);font-weight:400;font-size:11px;opacity:.85}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:stretch}
.row .no{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;padding-top:9px}

/* テキストと赤字表示を重ね、ミラー側が高さを決める（全文が常に見える） */
.field{position:relative;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field textarea,.field .mirror{display:block;width:100%;margin:0;border:0;padding:7px 10px 18px;font-family:var(--body);font-size:14px;line-height:22px;letter-spacing:0;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
.field .mirror{min-height:calc(22px * 2 + 25px);color:var(--fg);pointer-events:none}
.field .mirror .hot{color:var(--hot)}
.field textarea{position:absolute;inset:0;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg);outline:none}
.field textarea::placeholder{color:var(--muted)}
.field textarea::selection{background:var(--accent-soft);color:transparent}
.field .count{position:absolute;right:8px;bottom:3px;font-family:var(--mono);font-size:10px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums;line-height:1.2}

.reflect{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:4px;min-width:48px;padding:0 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.reflect:hover:not(:disabled){background:var(--accent);color:var(--accent-fg)}
.reflect:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reflect:disabled{opacity:.4;cursor:not-allowed}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1>メール帯プレビュー検討</h1>
      <div class="tabs" role="tablist" aria-label="検討案" id="tabs"></div>
    </div>
    <div class="params" aria-label="表示設定">
      <label for="pSubj">件名の赤字 <input id="pSubj" type="number" min="1" max="99"> 文字</label>
      <label for="pBody">本文の赤字 <input id="pBody" type="number" min="1" max="99"> 文字</label>
      <button class="btn-ghost" id="clearBtn" type="button">この案をすべて空にする</button>
    </div>
  </header>

  <div class="board" role="tabpanel" id="panel">
    <section class="panel" aria-labelledby="pvTitle">
      <h2 id="pvTitle">プレビュー画面</h2>
      <p class="hint">枠をクリックすると反映先（アクティブ）になります。送り主は直接入力できます。</p>
      <div class="band-label">メール帯</div>
      <div class="bands" id="bands"></div>
    </section>

    <section class="panel" aria-labelledby="selTitle">
      <h2 id="selTitle">選択画面</h2>
      <p class="hint" id="target"></p>
      <div class="cols">
        <div class="col" id="colSubject"></div>
        <div class="col" id="colBody"></div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const ROWS = 8, BANDS = 5, MAX = 45;
  const TABS = [
    { id:"A", label:"A案", title:"業界・職種を変えて、次のステージへ進む人がふえています" },
    { id:"B", label:"B案", title:"あなたのスキルは、自分で思っているより価値がある" }
  ];
  const emptyBand = (sender = "") => ({ sender, subject:"", subjectSrc:0, body:"", bodySrc:0 });
  const emptyPlan = () => ({
    active:0,
    subjects:Array(ROWS).fill(""),
    bodies:Array(ROWS).fill(""),
    bands:Array.from({length:BANDS}, () => emptyBand())
  });
  const pad = (a, n) => a.concat(Array(Math.max(0, n - a.length)).fill(""));

  /* デフォルト値：ページを開く／更新するたびにこの内容から始まる */
  const DEFAULT_SENDER = "フルキャスト 山崎";
  const DEFAULT_BODIES = [
    "フルキャストで副業をされている方限定で",
    "正社員として働きながら副業で稼ぐ以外にも、"
  ];
  const DEFAULTS = {
    A:{
      active:1,
      subjects:[
        "別の業界・職種に挑戦できる方法",
        "別の業界・職種を考慮した方がいい理由",
        "異業種への挑戦が増えてる理由",
        "ジョブチェンジが盛んな理由",
        "なぜ？業界・職種を変えて、次のステージへ進む人が増えています",
        "今の本業をガラっと変える人が増えています",
        "業界・職種の壁を越えて次のステージへ進む人が増えています",
        "業界・職種を変えて、次のステージへ進む人が増えています"
      ],
      bodies:DEFAULT_BODIES
    },
    B:{
      active:4,
      subjects:[
        "あなたの経験を評価しなおす方法",
        "なぜ今、経験の可視化が重要なのか",
        "未経験可の求人が増えている理由",
        "あなたのスキルは、自分で思っているより価値がある",
        "その経験、思ってるより価値があります",
        "あなたのご経験は武器になります。"
      ],
      bodies:DEFAULT_BODIES
    }
  };
  const defaultPlan = id => {
    const d = DEFAULTS[id];
    return {
      active:d.active,
      subjects:pad(d.subjects, ROWS),
      bodies:pad(d.bodies, ROWS),
      bands:Array.from({length:BANDS}, () => emptyBand(DEFAULT_SENDER))
    };
  };

  /* 状態は保存しない（更新すると常にデフォルト値に戻る） */
  const state = { tab:"A", params:{subj:15, body:16}, plans:Object.fromEntries(TABS.map(t => [t.id, defaultPlan(t.id)])) };
  const save = () => {};
  const plan = () => state.plans[state.tab];

  const chars = s => Array.from(s || "");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $ = id => document.getElementById(id);

  /* ---------- タブ ---------- */
  const tabsEl = $("tabs");
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.id = "tab" + t.id;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-controls", "panel");
    b.innerHTML = `<b>${t.label}：</b><span>${esc(t.title)}</span>`;
    b.addEventListener("click", () => { state.tab = t.id; save(); renderAll(); });
    tabsEl.appendChild(b);
  });
  tabsEl.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.findIndex(t => t.id === state.tab);
    const n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
    state.tab = n.id; save(); renderAll(); $("tab" + n.id).focus();
  });
  function renderTabs(){
    TABS.forEach(t => {
      const b = $("tab" + t.id), on = t.id === state.tab;
      b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    });
    $("panel").setAttribute("aria-labelledby", "tab" + state.tab);
  }

  /* ---------- プレビュー（DOMは一度だけ作り、中身だけ更新する） ---------- */
  const bandsEl = $("bands");
  const bandEls = [];
  for (let i = 0; i < BANDS; i++){
    const el = document.createElement("div");
    el.className = "band"; el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `メール帯 ${i+1} を反映先にする`);
    el.innerHTML = `
      <div class="num" aria-hidden="true">${i+1}</div>
      <div class="icon"><span class="badge">反映先</span>アイコン</div>
      <div class="lines">
        <div class="pv sender"><input id="sender${i}" placeholder="送り主" aria-label="送り主 ${i+1}" autocomplete="off"></div>
        <div class="pv subject" data-k="subject"><span class="txt"></span><span class="src"></span><button type="button" class="clear" aria-label="メール帯 ${i+1} の件名をクリア" title="クリア">×</button></div>
        <div class="pv body" data-k="body"><span class="txt"></span><span class="src"></span><button type="button" class="clear" aria-label="メール帯 ${i+1} の本文プレビューをクリア" title="クリア">×</button></div>
      </div>`;
    el.addEventListener("click", () => setActive(i));
    el.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); setActive(i); } });
    const s = el.querySelector("input");
    s.addEventListener("focus", () => setActive(i));
    s.addEventListener("input", () => { plan().bands[i].sender = s.value; save(); if (plan().active === i) renderTarget(); });
    el.querySelectorAll(".clear").forEach(btn => btn.addEventListener("click", e => {
      e.stopPropagation();
      const k = btn.parentElement.dataset.k, b = plan().bands[i];
      b[k] = ""; b[k + "Src"] = 0; save(); renderBand(i);
    }));
    bandsEl.appendChild(el); bandEls.push(el);
  }
  function renderBand(i){
    const b = plan().bands[i], el = bandEls[i];
    const s = el.querySelector("input");
    if (s.value !== b.sender) s.value = b.sender;
    [["subject","件名"],["body","本文プレビュー"]].forEach(([k, ph]) => {
      const pv = el.querySelector(`.pv[data-k="${k}"]`);
      const txt = pv.querySelector(".txt");
      txt.textContent = b[k] || ph;
      txt.classList.toggle("empty", !b[k]);
      txt.title = b[k] || "";
      pv.querySelector(".src").textContent = b[k + "Src"] ? `案${b[k + "Src"]}` : "";
      pv.querySelector(".clear").disabled = !b[k];
    });
  }
  function setActive(i){
    if (plan().active === i) return;
    plan().active = i; save(); renderActive();
  }
  function renderActive(){
    bandEls.forEach((el, i) => {
      const on = i === plan().active;
      el.classList.toggle("active", on); el.setAttribute("aria-pressed", on);
    });
    renderTarget();
  }
  function renderTarget(){
    const p = plan();
    $("target").innerHTML = `反映先：<b>メール帯 ${p.active+1}</b>（${esc(p.bands[p.active].sender || "送り主未入力")}）`;
  }

  /* ---------- 入力欄 ---------- */
  const fields = { subjects:[], bodies:[] };
  function buildCol(colEl, kind, title){
    const isSubj = kind === "subjects";
    colEl.innerHTML = `<div class="col-head">${title}<small id="${kind}Note"></small></div>`;
    for (let r = 0; r < ROWS; r++){
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="no">${r+1}</span>
        <div class="field">
          <div class="mirror" aria-hidden="true"></div>
          <textarea id="${kind}${r}" rows="2" autocomplete="off" spellcheck="false" aria-label="${title} ${r+1}" placeholder="${r === 0 ? "ユーザー記入欄" : ""}"></textarea>
          <span class="count"></span>
        </div>
        <button class="reflect" type="button" aria-label="${title} ${r+1} を反映">反映</button>`;
      const ta = row.querySelector("textarea");
      const mirror = row.querySelector(".mirror");
      const count = row.querySelector(".count");
      const btn = row.querySelector(".reflect");
      let composing = false;

      const paint = () => {
        const lim = isSubj ? state.params.subj : state.params.body;
        const cs = chars(ta.value);
        mirror.innerHTML = `<span class="hot">${esc(cs.slice(0, lim).join(""))}</span>${esc(cs.slice(lim).join(""))}​`;
        count.textContent = `${cs.length}/${MAX}`;
        btn.disabled = cs.length === 0;
      };
      const commit = () => {
        let v = ta.value.replace(/[\r\n]+/g, "");
        const cs = chars(v);
        if (cs.length > MAX) v = cs.slice(0, MAX).join("");
        if (v !== ta.value){
          const pos = Math.min(ta.selectionStart, v.length);
          ta.value = v; ta.setSelectionRange(pos, pos);
        }
        plan()[kind][r] = v; save();
      };
      ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) e.preventDefault(); });
      ta.addEventListener("compositionstart", () => composing = true);
      ta.addEventListener("compositionend", () => { composing = false; commit(); paint(); });
      ta.addEventListener("input", () => { if (!composing) commit(); paint(); });
      btn.addEventListener("click", () => reflect(kind, r));

      fields[kind][r] = { ta, paint };
      colEl.appendChild(row);
    }
  }
  function renderFields(){
    ["subjects","bodies"].forEach(k => fields[k].forEach((f, r) => { f.ta.value = plan()[k][r] || ""; f.paint(); }));
  }

  function reflect(kind, r){
    const isSubj = kind === "subjects";
    const lim = isSubj ? state.params.subj : state.params.body;
    const text = chars(plan()[kind][r]).slice(0, lim).join("");
    if (!text) return;
    const i = plan().active, b = plan().bands[i], k = isSubj ? "subject" : "body";
    b[k] = text; b[k + "Src"] = r + 1;
    save(); renderBand(i);
    const pv = bandEls[i].querySelector(`.pv[data-k="${k}"]`);
    pv.classList.add("flash"); setTimeout(() => pv.classList.remove("flash"), 600);
  }

  /* ---------- 赤字文字数 ---------- */
  const pS = $("pSubj"), pB = $("pBody");
  function syncParams(){
    pS.value = state.params.subj; pB.value = state.params.body;
    $("subjectsNote").textContent = `先頭${state.params.subj}文字が赤字`;
    $("bodiesNote").textContent = `先頭${state.params.body}文字が赤字`;
  }
  function onParam(){
    const n = (el, d) => Math.max(1, parseInt(el.value, 10) || d);
    state.params = { subj:n(pS, 15), body:n(pB, 16) };
    save(); syncParams();
    Object.values(fields).flat().forEach(f => f.paint());
  }
  [pS, pB].forEach(el => el.addEventListener("change", onParam));

  $("clearBtn").addEventListener("click", () => {
    const active = plan().active;
    state.plans[state.tab] = emptyPlan(); plan().active = active;
    save(); renderAll();
  });

  function renderAll(){
    renderTabs(); syncParams(); renderFields();
    for (let i = 0; i < BANDS; i++) renderBand(i);
    renderActive();
  }
  buildCol($("colSubject"), "subjects", "件名案");
  buildCol($("colBody"), "bodies", "本文Prev");
  renderAll();
})();
</script>
</body>
</html>
