<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メール帯プレビュー検討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 左にメール帯プレビュー（受信箱風）、右に件名案／本文案の選択グリッド。狭い画面では縦積み */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#17262e; --muted:#5d6f78; --line:#cdd8de;
  --accent:#165c7d; --accent-fg:#ffffff; --accent-soft:#dcebf2;
  --icon:#e8792f; --field:#eaf0dc; --hot:#d21f1f; --flash:#fff3b0;
  --display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --surface:#17242b; --fg:#e4edf1; --muted:#93a7b1; --line:#2c3d46;
  --accent:#3f93ba; --accent-fg:#06141b; --accent-soft:#1d3a49;
  --icon:#f08a45; --field:#26321f; --hot:#ff6b6b; --flash:#4a4214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --surface:#17242b; --fg:#e4edf1; --muted:#93a7b1; --line:#2c3d46;
  --accent:#3f93ba; --accent-fg:#06141b; --accent-soft:#1d3a49;
  --icon:#f08a45; --field:#26321f; --hot:#ff6b6b; --flash:#4a4214; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--muted);font-size:13px}
.params{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:12px;color:var(--muted)}
.params label{display:flex;align-items:center;gap:6px}
.params input{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);font-family:var(--mono);font-size:12px}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn-ghost:hover{border-color:var(--accent)}

.board{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-size:16px;margin:0 0 4px}
.panel .hint{margin:0 0 14px;font-size:12px;color:var(--muted)}

/* ---------- プレビュー ---------- */
.band-label{font-size:12px;font-weight:700;color:var(--icon);letter-spacing:.04em;margin-bottom:6px}
.bands{display:flex;flex-direction:column;gap:10px}
.band{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface);transition:box-shadow .15s,border-color .15s}
.band:hover{border-color:var(--accent)}
.band:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.band .icon{width:64px;height:64px;border-radius:50%;background:var(--icon);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;position:relative}
.band .badge{position:absolute;top:-4px;left:-4px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;opacity:0;transition:opacity .15s}
.band.active .badge{opacity:1}
.band .lines{display:flex;flex-direction:column;gap:4px;min-width:0}
.pv{background:var(--field);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;min-height:26px;display:flex;align-items:center;gap:6px;min-width:0;transition:background .5s}
.pv .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pv .txt.empty{color:var(--muted)}
.pv.subject .txt:not(.empty){font-weight:700}
.pv .src{flex:none;font-family:var(--mono);font-size:10px;color:var(--muted)}
.pv input{border:0;background:transparent;color:var(--fg);font:inherit;width:100%;padding:0}
.pv input:focus{outline:none}
.pv.flash{background:var(--flash)}

/* ---------- 選択画面 ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col-head{background:var(--accent);color:var(--accent-fg);text-align:center;font-family:var(--display);font-size:15px;padding:8px;border-radius:4px}
.col-head small{display:block;font-family:var(--body);font-weight:400;font-size:11px;opacity:.85}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.row .no{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}

.field{position:relative;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--surface);height:42px}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field input,.field .mirror{position:absolute;inset:0;width:100%;height:100%;padding:0 58px 0 10px;font-family:var(--body);font-size:14px;line-height:40px;letter-spacing:0;border:0;margin:0}
.field input{background:transparent;color:transparent;caret-color:var(--fg);z-index:2;outline:none}
.field input::placeholder{color:var(--muted)}
.field input::selection{background:var(--accent-soft);color:transparent}
.field .mirror{white-space:pre;overflow:hidden;color:var(--fg);z-index:1;pointer-events:none}
.field .mirror .hot{color:var(--hot);font-weight:700}
.field .count{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);z-index:3;pointer-events:none;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.field .count.full{color:var(--hot)}

.reflect{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:4px;height:42px;min-width:48px;padding:0 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;writing-mode:horizontal-tb}
.reflect:hover:not(:disabled){background:var(--accent);color:var(--accent-fg)}
.reflect:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reflect:disabled{opacity:.4;cursor:not-allowed}

.status{font-size:12px;color:var(--muted);min-height:18px}
.status b{color:var(--fg)}

.spec{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.spec ul{margin:4px 0 0;padding-left:18px;display:grid;gap:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>メール帯プレビュー検討</h1>
      <p class="lede">件名案・本文案を入力し、「反映」で選択中のメール帯に赤字部分を差し込みます。</p>
    </div>
    <div class="params" aria-label="仕様パラメータ">
      <label for="pSubj">件名の赤字 <input id="pSubj" type="number" min="1" max="45"> 文字</label>
      <label for="pBody">本文の赤字 <input id="pBody" type="number" min="1" max="45"> 文字</label>
      <label for="pMax">上限 <input id="pMax" type="number" min="1" max="200"> 文字</label>
      <button class="btn-ghost" id="resetBtn" type="button">サンプルに戻す</button>
      <button class="btn-ghost" id="clearBtn" type="button">すべて空にする</button>
    </div>
  </header>

  <div class="board">
    <section class="panel" aria-labelledby="pvTitle">
      <h2 id="pvTitle">プレビュー画面</h2>
      <p class="hint">枠をクリックすると反映先（アクティブ）になります。送り主は直接編集できます。</p>
      <div class="band-label">メール帯</div>
      <div class="bands" id="bands"></div>
    </section>

    <section class="panel" aria-labelledby="selTitle">
      <h2 id="selTitle">選択画面</h2>
      <p class="hint" id="target"></p>
      <div class="cols">
        <div class="col" id="colSubject"></div>
        <div class="col" id="colBody"></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="spec">
        仕様メモ
        <ul>
          <li>入力欄は上限文字数まで入力可能。先頭の指定文字数を赤字、それ以降を黒字で表示</li>
          <li>「反映」で赤字部分のみをアクティブなメール帯へ反映。既に文字がある場合は上書き</li>
          <li>入力内容はこのブラウザに保存されます（他の人には共有されません）</li>
        </ul>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const ROWS = 5, BANDS = 4;
  const SAMPLE = {
    params:{subj:15, body:16, max:45},
    active:0,
    subjects:[
      "【本日限定】全品ポイント10倍！週末セールのお知らせと人気ランキング",
      "会員様だけの特別クーポンをお届けします｜有効期限は今週日曜まで",
      "秋の新作が入荷しました。スタッフおすすめコーデをご紹介",
      "", ""
    ],
    bodies:[
      "いつもご利用ありがとうございます。今週末は全品ポイント10倍キャンペーンを開催中です。",
      "前回ご購入の商品に合わせて、おすすめアイテムをピックアップしました。",
      "", "", ""
    ],
    bands:[
      {sender:"ABCストア", subject:"【本日限定】全品ポイント10倍！", subjectSrc:1, body:"いつもご利用ありがとうございます。", bodySrc:1},
      {sender:"トラベル予約ナビ", subject:"", subjectSrc:0, body:"", bodySrc:0},
      {sender:"フィットネスクラブ", subject:"", subjectSrc:0, body:"", bodySrc:0},
      {sender:"書店オンライン", subject:"", subjectSrc:0, body:"", bodySrc:0}
    ]
  };
  const KEY = "mail-band-preview-v1";
  const clone = o => JSON.parse(JSON.stringify(o));
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || clone(SAMPLE); } catch { state = clone(SAMPLE); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const chars = s => Array.from(s || "");
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $ = id => document.getElementById(id);

  /* ---------- プレビュー ---------- */
  const bandsEl = $("bands");
  function renderBands(){
    bandsEl.innerHTML = "";
    state.bands.forEach((b, i) => {
      const el = document.createElement("div");
      el.className = "band" + (i === state.active ? " active" : "");
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-pressed", i === state.active);
      el.setAttribute("aria-label", `メール帯 ${i+1}`);
      el.innerHTML = `
        <div class="icon"><span class="badge">反映先</span>アイコン</div>
        <div class="lines">
          <div class="pv sender"><input id="sender${i}" value="${esc(b.sender)}" placeholder="送り主" aria-label="送り主 ${i+1}"></div>
          <div class="pv subject" data-k="subject"><span class="txt ${b.subject ? "" : "empty"}">${b.subject ? esc(b.subject) : "件名"}</span>${b.subjectSrc ? `<span class="src">案${b.subjectSrc}</span>` : ""}</div>
          <div class="pv body" data-k="body"><span class="txt ${b.body ? "" : "empty"}">${b.body ? esc(b.body) : "本文プレビュー"}</span>${b.bodySrc ? `<span class="src">案${b.bodySrc}</span>` : ""}</div>
        </div>`;
      const activate = () => { if (state.active !== i) { state.active = i; save(); renderBands(); renderTarget(); } };
      el.addEventListener("click", activate);
      el.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); activate(); } });
      const s = el.querySelector("input");
      s.addEventListener("focus", activate);
      s.addEventListener("input", () => { b.sender = s.value; save(); });
      bandsEl.appendChild(el);
    });
  }
  function renderTarget(){
    $("target").innerHTML = `反映先：<b>メール帯 ${state.active+1}</b>（${esc(state.bands[state.active].sender || "送り主未設定")}）`;
  }

  /* ---------- 入力欄 ---------- */
  const fields = { subjects:[], bodies:[] };
  function buildCol(colEl, kind, title){
    const isSubj = kind === "subjects";
    colEl.innerHTML = `<div class="col-head">${title}<small id="${kind}Note"></small></div>`;
    for (let r = 0; r < ROWS; r++){
      const row = document.createElement("div");
      row.className = "row";
      const id = `${kind}${r}`;
      row.innerHTML = `
        <span class="no">${r+1}</span>
        <div class="field">
          <div class="mirror" aria-hidden="true"></div>
          <input id="${id}" type="text" autocomplete="off" spellcheck="false" aria-label="${title} ${r+1}" placeholder="${r === 0 && isSubj ? "ユーザー記入欄" : ""}">
          <span class="count"></span>
        </div>
        <button class="reflect" type="button" aria-label="${title} ${r+1} を反映">反映</button>`;
      const input = row.querySelector("input");
      const mirror = row.querySelector(".mirror");
      const count = row.querySelector(".count");
      const btn = row.querySelector(".reflect");
      input.value = state[kind][r] || "";
      let composing = false;

      const paint = () => {
        const lim = isSubj ? state.params.subj : state.params.body;
        const cs = chars(input.value);
        const hot = cs.slice(0, lim).join(""), rest = cs.slice(lim).join("");
        mirror.innerHTML = `<span class="hot">${esc(hot)}</span>${esc(rest)}`;
        mirror.scrollLeft = input.scrollLeft;
        count.textContent = `${cs.length}/${state.params.max}`;
        count.classList.toggle("full", cs.length >= state.params.max);
        btn.disabled = cs.length === 0;
      };
      const enforce = () => {
        const cs = chars(input.value);
        if (cs.length > state.params.max){
          const pos = input.selectionStart;
          input.value = cs.slice(0, state.params.max).join("");
          input.setSelectionRange(Math.min(pos, input.value.length), Math.min(pos, input.value.length));
        }
        state[kind][r] = input.value; save();
      };
      input.addEventListener("compositionstart", () => composing = true);
      input.addEventListener("compositionend", () => { composing = false; enforce(); paint(); });
      input.addEventListener("input", () => { if (!composing) enforce(); paint(); });
      ["scroll","keyup","click","select","focus","blur"].forEach(ev => input.addEventListener(ev, () => { mirror.scrollLeft = input.scrollLeft; }));
      btn.addEventListener("click", () => reflect(kind, r));

      fields[kind][r] = { input, paint };
      colEl.appendChild(row);
      paint();
    }
  }

  function reflect(kind, r){
    const isSubj = kind === "subjects";
    const lim = isSubj ? state.params.subj : state.params.body;
    const text = chars(state[kind][r]).slice(0, lim).join("");
    if (!text) return;
    const b = state.bands[state.active];
    const k = isSubj ? "subject" : "body";
    const overwrote = !!b[k];
    b[k] = text; b[k + "Src"] = r + 1;
    save(); renderBands();
    const pv = bandsEl.children[state.active].querySelector(`.pv[data-k="${k}"]`);
    pv.classList.add("flash"); setTimeout(() => pv.classList.remove("flash"), 600);
    $("status").innerHTML = `メール帯 ${state.active+1} の${isSubj ? "件名" : "本文プレビュー"}に<b>${isSubj ? "件名" : "本文"}案${r+1}</b>を${overwrote ? "上書き" : "反映"}しました：「${esc(text)}」`;
  }

  /* ---------- パラメータ ---------- */
  const pS = $("pSubj"), pB = $("pBody"), pM = $("pMax");
  function syncParams(){
    pS.value = state.params.subj; pB.value = state.params.body; pM.value = state.params.max;
    $("subjectsNote").textContent = `${state.params.max}文字まで・先頭${state.params.subj}文字が赤字`;
    $("bodiesNote").textContent = `${state.params.max}文字まで・先頭${state.params.body}文字が赤字`;
  }
  function onParam(){
    const n = (el, d) => Math.max(1, parseInt(el.value, 10) || d);
    state.params = { subj:n(pS, 15), body:n(pB, 16), max:n(pM, 45) };
    save(); syncParams();
    Object.values(fields).flat().forEach(f => f.paint());
  }
  [pS, pB, pM].forEach(el => el.addEventListener("change", onParam));

  function boot(){
    buildCol($("colSubject"), "subjects", "件名案");
    buildCol($("colBody"), "bodies", "本文Prev");
    syncParams(); renderBands(); renderTarget();
    $("status").textContent = "";
  }
  $("resetBtn").addEventListener("click", () => { state = clone(SAMPLE); save(); boot(); });
  $("clearBtn").addEventListener("click", () => {
    state.subjects = Array(ROWS).fill(""); state.bodies = Array(ROWS).fill("");
    state.bands.forEach(b => { b.subject = ""; b.body = ""; b.subjectSrc = 0; b.bodySrc = 0; });
    save(); boot();
  });
  boot();
})();
</script>
</body>
</html>
